<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" fill="none">
  <!-- Shield background -->
  <path d="M10 20 L210 5 L410 20 L410 110 L210 155 L10 110 Z" fill="#78C828" stroke="#1a1a1a" stroke-width="4"/>
  <path d="M18 24 L210 11 L402 24 L402 108 L210 148 L18 108 Z" fill="#0A0A0A"/>

  <!-- 204 text -->
  <text x="30" y="72" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#78C828" letter-spacing="-2">204</text>

  <!-- JUNK PROS banner -->
  <path d="M10 82 L410 82 L400 120 L20 120 Z" fill="#0A0A0A" stroke="#78C828" stroke-width="2"/>
  <text x="210" y="110" font-family="Arial Black, sans-serif" font-size="34" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">JUNK PROS</text>

  <!-- Truck silhouette -->
  <g transform="translate(220, 10)">
    <!-- Truck body -->
    <rect x="20" y="20" width="90" height="45" rx="3" fill="#1a1a1a"/>
    <!-- Cab -->
    <path d="M110 30 L110 65 L145 65 L145 38 L130 30 Z" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Windshield -->
    <path d="M115 33 L128 33 L140 40 L140 55 L115 55 Z" fill="#78C828" opacity="0.4"/>
    <!-- Wheels -->
    <circle cx="45" cy="68" r="10" fill="#333"/>
    <circle cx="45" cy="68" r="5" fill="#666"/>
    <circle cx="120" cy="68" r="10" fill="#333"/>
    <circle cx="120" cy="68" r="5" fill="#666"/>
    <!-- Junk pile -->
    <rect x="25" y="5" width="35" height="18" rx="2" fill="#555"/>
    <rect x="55" y="8" width="25" height="15" rx="2" fill="#7a5c3a"/>
    <rect x="35" y="0" width="20" height="12" rx="2" fill="#444"/>
  </g>

  <!-- WE HAUL IT tagline -->
  <text x="232" y="78" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#78C828" letter-spacing="0.5">WE HAUL IT. YOU RELAX.</text>

  <!-- Bottom text -->
  <text x="210" y="138" font-family="Arial, sans-serif" font-size="10" fill="#78C828" text-anchor="middle" letter-spacing="2">JUNK REMOVAL &amp; HAULING</text>
</svg>
